# Pretzuri web app. Separate compose project (<project>-web) so the Supabase services of <project> are never
# seen as orphans. Image built by infra/nas/deploy-web.sh. Published directly (no edge/redirect container:
# HTTP->HTTPS is done by Cloudflare "Always Use HTTPS").
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required (e.g. pretzuri-dev-web)}

services:
  web:
    image: pretzuri-web:${PRETZURI_ENV:?PRETZURI_ENV is required (dev|prod)}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_HTTP_PORT:?WEB_HTTP_PORT is required}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
